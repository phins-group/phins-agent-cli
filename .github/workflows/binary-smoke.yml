name: Verify release binary on Windows

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag containing the candidate assets
        required: true
        default: v0.1.0

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    # GitHub restricts draft-release visibility to write-capable credentials.
    # The token is passed only to the download step, never to the executable.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Download the exact candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "phins-release"
          New-Item -ItemType Directory -Path $stage | Out-Null
          gh release download "$env:RELEASE_TAG" --pattern "phins-0.1.0-local-windows-x64.zip" --dir "$stage"
          if ($LASTEXITCODE -ne 0) { throw "Binary download failed" }
          gh release download "$env:RELEASE_TAG" --pattern "SHA256SUMS" --dir "$stage"
          if ($LASTEXITCODE -ne 0) { throw "Checksum download failed" }
          $archive = Join-Path $stage "phins-0.1.0-local-windows-x64.zip"
          $line = Get-Content (Join-Path $stage "SHA256SUMS") | Where-Object { $_ -match "  phins-0.1.0-local-windows-x64.zip$" }
          if (-not $line) { throw "Archive checksum missing" }
          $expected = ($line -split "\s+")[0]
          if ((Get-FileHash -Algorithm SHA256 $archive).Hash.ToLower() -ne $expected) { throw "Archive checksum mismatch" }
          Expand-Archive -LiteralPath $archive -DestinationPath $stage
      - name: Diagnose Windows ACL process environment
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import base64,json,os,subprocess,tempfile,time
          source=Path('packages/terminal/src/agent/runtime-privacy.ts').read_text()
          body=source.split('const inspectAcl = `',1)[1].split('`',1)[0]
          shell=str(Path(os.environ['SystemRoot'])/'System32/WindowsPowerShell/v1.0/powershell.exe')
          with tempfile.TemporaryDirectory(prefix='phins-acl-env-') as folder:
            for label in ['full','filtered']:
              directory=Path(folder)/label;directory.mkdir()
              env=dict(os.environ) if label=='full' else {k:os.environ[k] for k in ['SystemRoot','WINDIR','COMSPEC','TEMP','TMP','USERPROFILE','PATH','PSModulePath','APPDATA','LOCALAPPDATA','ProgramFiles','ProgramFiles(x86)','ProgramData','SystemDrive'] if k in os.environ}
              env.update(PHINS_RUNTIME_PATH=str(directory),PHINS_RUNTIME_PROTECT='1')
              start=time.monotonic()
              try:
                r=subprocess.run([shell,'-NoLogo','-NoProfile','-NonInteractive','-EncodedCommand',base64.b64encode(body.encode('utf-16le')).decode()],env=env,stdin=subprocess.DEVNULL,capture_output=True,timeout=15)
                print(json.dumps({'environment':label,'exit':r.returncode,'seconds':round(time.monotonic()-start,2),'stdoutBytes':len(r.stdout),'stderrBytes':len(r.stderr)}))
                if label=='full' and r.returncode:print(r.stderr.decode(errors='replace')[:1600])
              except subprocess.TimeoutExpired:
                print(json.dumps({'environment':label,'timeout':True,'seconds':round(time.monotonic()-start,2)}))
          '@ | python
      - name: Verify native Windows runtime ACL policy
        shell: pwsh
        env:
          BUN_BE_BUN: "1"
        run: |
          $binary = Join-Path $env:RUNNER_TEMP "phins-release/phins-0.1.0-local-windows-x64/phins.exe"
          $probe = Join-Path $env:RUNNER_TEMP "phins-acl-tests"
          New-Item -ItemType Directory -Path "$probe/src/agent", "$probe/test/agent" -Force | Out-Null
          Copy-Item packages/terminal/src/agent/runtime-privacy.ts "$probe/src/agent/runtime-privacy.ts"
          Copy-Item packages/terminal/test/agent/runtime-privacy.test.ts "$probe/test/agent/runtime-privacy.test.ts"
          Push-Location $probe
          & $binary test test/agent/runtime-privacy.test.ts
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { throw "Native Windows ACL tests failed" }
      - name: Check standalone startup without installing agent packages
        shell: pwsh
        run: |
          $binary = Join-Path $env:RUNNER_TEMP "phins-release/phins-0.1.0-local-windows-x64/phins.exe"
          python scripts/smoke-binary.py "$binary"
          if ($LASTEXITCODE -ne 0) { throw "Windows startup smoke failed" }
      - name: Reproduce bundled demo without installing packages
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP "phins-release/phins-0.1.0-local-windows-x64"
          Set-Location $bundle
          node --version
          git --version
          node scripts/demo.mjs prepare
          if ($LASTEXITCODE -ne 0) { throw "Demo preparation failed" }
          $tests = node scripts/demo.mjs test 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Output $tests
          if ($code -ne 1 -or $tests -notmatch "# tests 27" -or $tests -notmatch "# pass 22" -or $tests -notmatch "# fail 5") { throw "Expected historical baseline was not reproduced" }
          $global:LASTEXITCODE = 0
