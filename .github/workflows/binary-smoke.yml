name: Verify release binary on Windows

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag containing the candidate assets
        required: true
        default: v0.1.2
      runner:
        description: Windows runner (ARM64 is an unqualified compatibility probe)
        type: choice
        options: [windows-2025, windows-2022, windows-11-arm]
        default: windows-2025

permissions:
  contents: read

jobs:
  windows:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    # GitHub restricts draft-release visibility to write-capable credentials.
    # The token is passed only to the download step, never to the executable.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Download the exact candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v([0-9]+\.[0-9]+\.[0-9]+)$') { throw "Expected a versioned release tag" }
          $label = "phins-$($Matches[1])-local-windows-x64"
          "PHINS_BINARY_LABEL=$label" >> $env:GITHUB_ENV
          $stage = Join-Path $env:RUNNER_TEMP "phins-release"
          New-Item -ItemType Directory -Path $stage | Out-Null
          gh release download "$env:RELEASE_TAG" --pattern "$label.zip" --dir "$stage"
          if ($LASTEXITCODE -ne 0) { throw "Binary download failed" }
          gh release download "$env:RELEASE_TAG" --pattern "SHA256SUMS" --dir "$stage"
          if ($LASTEXITCODE -ne 0) { throw "Checksum download failed" }
          $archive = Join-Path $stage "$label.zip"
          $pattern = '  ' + [regex]::Escape("$label.zip") + '$'
          $line = Get-Content (Join-Path $stage "SHA256SUMS") | Where-Object { $_ -match $pattern }
          if (-not $line) { throw "Archive checksum missing" }
          $expected = ($line -split "\s+")[0]
          if ((Get-FileHash -Algorithm SHA256 $archive).Hash.ToLower() -ne $expected) { throw "Archive checksum mismatch" }
          & "$env:SystemRoot/System32/tar.exe" -xf $archive -C $stage
          if ($LASTEXITCODE -ne 0) { throw "Release extraction failed" }
      - name: Verify native Windows runtime ACL policy
        shell: pwsh
        env:
          BUN_BE_BUN: "1"
        run: |
          $binary = Join-Path $env:RUNNER_TEMP "phins-release/$env:PHINS_BINARY_LABEL/phins.exe"
          $probe = Join-Path $env:RUNNER_TEMP "phins-acl-tests"
          New-Item -ItemType Directory -Path "$probe/src/agent", "$probe/test/agent" -Force | Out-Null
          Copy-Item packages/terminal/src/agent/runtime-privacy.ts "$probe/src/agent/runtime-privacy.ts"
          Copy-Item packages/terminal/src/agent/windows-acl.ts "$probe/src/agent/windows-acl.ts"
          Copy-Item packages/terminal/test/agent/runtime-privacy.test.ts "$probe/test/agent/runtime-privacy.test.ts"
          Push-Location $probe
          & $binary test test/agent/runtime-privacy.test.ts
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { throw "Native Windows ACL tests failed" }
      - name: Check standalone startup without installing agent packages
        shell: pwsh
        run: |
          $binary = Join-Path $env:RUNNER_TEMP "phins-release/$env:PHINS_BINARY_LABEL/phins.exe"
          python scripts/smoke-binary.py "$binary"
          if ($LASTEXITCODE -ne 0) { throw "Windows startup smoke failed" }
      - name: Reproduce bundled demo without installing packages
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP "phins-release/$env:PHINS_BINARY_LABEL"
          Set-Location $bundle
          node --version
          git --version
          node scripts/demo.mjs prepare
          if ($LASTEXITCODE -ne 0) { throw "Demo preparation failed" }
          $tests = node scripts/demo.mjs test 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Output $tests
          if ($code -ne 1 -or $tests -notmatch "# tests 27" -or $tests -notmatch "# pass 22" -or $tests -notmatch "# fail 5") { throw "Expected historical baseline was not reproduced" }
          $global:LASTEXITCODE = 0
