name: Native binary build and startup

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build.yml
      - packages/**
      - scripts/build-local.ts
      - scripts/standalone.ts
      - scripts/smoke-*.py
      - configs/models.json
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  pull_request:
    paths:
      - .github/workflows/build.yml
      - packages/**
      - scripts/build-local.ts
      - scripts/standalone.ts
      - scripts/smoke-*.py
      - configs/models.json
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml

permissions:
  contents: read

concurrency:
  group: native-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
            binary: phins
          - target: darwin-x64
            runner: macos-15-intel
            binary: phins
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            binary: phins
          - target: linux-x64
            runner: ubuntu-24.04
            binary: phins
          - target: windows-x64
            runner: windows-2025
            binary: phins.exe
            bun_url: https://github.com/oven-sh/bun/releases/download/bun-v1.3.12/bun-windows-x64-baseline.zip
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.12'
          bun-download-url: ${{ matrix.bun_url || '' }}
      - name: Install frozen build dependencies
        run: |
          npm install --global pnpm@10.26.0 --ignore-scripts
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Check types and ACL policy
        run: |
          pnpm check
          pnpm --filter @phins/terminal exec bun test test/agent/runtime-privacy.test.ts
      - name: Compile on the target operating system
        run: bun scripts/build-local.ts --target '${{ matrix.target }}'
      - name: Verify the compiled binary in a real terminal
        run: python scripts/smoke-binary.py 'dist/${{ matrix.target }}/${{ matrix.binary }}'
      - name: Record build checksum
        if: ${{ always() }}
        run: |
          if test -f 'dist/${{ matrix.target }}/build.json'; then
            cat 'dist/${{ matrix.target }}/build.json' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo 'Offline build/startup checks only. No model credentials or inference. Release packaging and publication are separate.' >> "$GITHUB_STEP_SUMMARY"
