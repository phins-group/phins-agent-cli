name: Verify standalone installers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [install.sh, install.ps1, docs/QUICKSTART.md, scripts/install.test.mjs, .github/workflows/install.yml]
  pull_request:
    paths: [install.sh, install.ps1, docs/QUICKSTART.md, scripts/install.test.mjs, .github/workflows/install.yml]

permissions:
  contents: read

jobs:
  install:
    name: ${{ matrix.target }} (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: linux-x64
            runner: ubuntu-24.04
          - target: windows-x64
            runner: windows-2025
          - target: windows-x64
            runner: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check installer regression cases
        run: node --test scripts/install.test.mjs
      - name: Install and repeat on macOS or Linux
        if: runner.os != 'Windows'
        shell: bash
        run: |
          install_home="$RUNNER_TEMP/PHINs install à"
          mkdir -p "$install_home"
          url="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/install.sh"
          phins_installer="$(curl -fsSL "$url")"
          env HOME="$install_home" sh -c "$phins_installer"
          env HOME="$install_home" sh -c "$phins_installer"
          echo "INSTALLED_BINARY=$install_home/.local/bin/phins" >> "$GITHUB_ENV"
      - name: Install and repeat on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw 'Expected Windows PowerShell 5.1' }
          Write-Host "Fresh install with Windows PowerShell $($PSVersionTable.PSVersion)"
          Write-Host "64-bit OS: $([Environment]::Is64BitOperatingSystem); shell CPU: $env:PROCESSOR_ARCHITECTURE; native CPU: $env:PROCESSOR_ARCHITEW6432"
          $installDirectory = 'PHINs install ' + [char]0x00e0 + '/AppData/Local'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP $installDirectory
          $url = "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/install.ps1"
          $script = [scriptblock]::Create((Invoke-RestMethod $url))
          & $script
          & $script
          "INSTALL_LOCALAPPDATA=$env:LOCALAPPDATA" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "INSTALLED_BINARY=$env:LOCALAPPDATA/PHINsAgent/phins-0.1.2-local-windows-x64/phins.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Check PowerShell 7 onboarding
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = $env:INSTALL_LOCALAPPDATA
          $url = "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/install.ps1"
          if ($PSVersionTable.PSVersion.Major -lt 7) { throw 'Expected PowerShell 7' }
          Invoke-RestMethod $url | Invoke-Expression
          & "$env:LOCALAPPDATA/PHINsAgent/bin/phins.cmd" --version
          if ($LASTEXITCODE -ne 0) { throw 'Windows launcher failed' }
      - name: Verify every installed release file
        shell: python
        run: |
          import hashlib, json, os, pathlib
          bundle = pathlib.Path(os.environ['INSTALLED_BINARY']).resolve().parent
          manifest = json.loads((bundle / 'INSTALL_MANIFEST.json').read_text())
          for entry in manifest['files']:
              file = bundle / entry['path']
              assert file.resolve().is_relative_to(bundle) and file.is_file(), entry['path']
              with file.open('rb') as stream:
                  assert hashlib.file_digest(stream, 'sha256').hexdigest() == entry['sha256'], entry['path']
          print(f"Verified {len(manifest['files'])} release files, including all bundled notices.")
      - name: Verify the actual installed binary
        shell: bash
        run: python scripts/smoke-binary.py "$INSTALLED_BINARY"
      - name: Reproduce the bundled historical baseline
        shell: python
        run: |
          import os, pathlib, subprocess
          bundle = pathlib.Path(os.environ['INSTALLED_BINARY']).resolve().parent
          subprocess.run(['node', 'scripts/demo.mjs', 'prepare'], cwd=bundle, check=True)
          result = subprocess.run(['node', 'scripts/demo.mjs', 'test'], cwd=bundle, text=True, capture_output=True)
          print(result.stdout)
          assert result.returncode == 1
          assert all(value in result.stdout for value in ('# tests 27', '# pass 22', '# fail 5'))
      - name: Verify confirmed uninstall with the installed executable
        shell: bash
        run: python scripts/smoke-uninstall.py "$INSTALLED_BINARY"
      - name: Verify Windows protects an existing command and changed binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = $env:INSTALL_LOCALAPPDATA
          $launcher = Join-Path $env:LOCALAPPDATA 'PHINsAgent/bin/phins.cmd'
          $original = [IO.File]::ReadAllText($launcher)
          [IO.File]::WriteAllText($launcher, 'user-owned fixture')
          $rejected = $false
          try { & ./install.ps1 } catch {
            if ($_.Exception.Message -notlike '*Existing command preserved*') { throw }
            $rejected = $true
          }
          if (-not $rejected -or [IO.File]::ReadAllText($launcher) -ne 'user-owned fixture') { throw 'Existing command was not protected' }
          [IO.File]::WriteAllText($launcher, $original)
          Add-Content -LiteralPath $env:INSTALLED_BINARY -Value 'changed fixture'
          $before = (Get-FileHash -LiteralPath $env:INSTALLED_BINARY).Hash
          $rejected = $false
          try { & ./install.ps1 } catch {
            if ($_.Exception.Message -notlike '*Existing installation changed*') { throw }
            $rejected = $true
          }
          if (-not $rejected -or (Get-FileHash -LiteralPath $env:INSTALLED_BINARY).Hash -ne $before) { throw 'Changed binary was not preserved' }
